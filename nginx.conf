server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /herramientas/plotx {
        return 301 https://$host/herramientas/plotx/;
    }

    # Assets con hash de Vite: cacheables un año.
    location /herramientas/plotx/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /herramientas/plotx/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /herramientas/plotx/index.html;
    }

    # La app solo vive bajo /herramientas/plotx/; fuera de ahí, 404.
    location / {
        return 404;
    }
}
